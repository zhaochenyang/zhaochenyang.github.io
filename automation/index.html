<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#faf9f7;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--accent:#bf4520;
--sans:'Geist','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
--serif:'Instrument Serif','Noto Serif SC','Songti SC',serif;
--mono:'Geist Mono',ui-monospace,'SF Mono',monospace}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.9;font-size:16.5px}
.wrap{max-width:760px;margin:0 auto;padding:56px 24px 80px}
.kicker{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.18em;color:var(--muted)}
.kicker b{color:var(--accent);font-weight:600}
h1{font-size:34px;line-height:1.35;font-weight:700;margin:14px 0 10px;color:var(--ink)}
.meta{font-size:13px;color:var(--soft);margin-bottom:8px}
.rule{height:4px;width:52px;background:var(--accent);margin:18px 0 30px}
blockquote{border-left:3px solid var(--accent);background:rgba(191,69,32,.05);padding:14px 18px;border-radius:0 8px 8px 0;margin:0 0 26px;font-size:15px;color:var(--muted)}
blockquote p{margin:0}
h2{font-size:22px;font-weight:700;margin:40px 0 14px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.5}
p{margin:0 0 16px}
ul,ol{margin:0 0 18px 22px}
li{margin-bottom:8px}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(191,69,32,.35)}
strong{font-weight:700;color:var(--ink)}
table{border-collapse:collapse;width:100%;margin:6px 0 22px;font-size:14.5px}
th,td{border:1px solid #ddd8d2;padding:8px 10px;text-align:left;vertical-align:top}
th{background:#f0eeea;font-weight:700}
figure{margin:26px 0}
figure img{width:100%;border:1px solid #e5e1db;border-radius:10px;display:block}
figcaption{text-align:center;font-size:13px;color:var(--soft);margin-top:10px}
pre{background:#f4f2ef;border:1px solid #e5e1db;border-radius:8px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.8;overflow-x:auto;white-space:pre-wrap;word-break:break-all;margin:0 0 20px}
hr{border:none;border-top:1px solid #e5e1db;margin:36px 0}
.foot{margin-top:52px;padding-top:22px;border-top:1px solid #e5e1db;font-size:14px;color:var(--soft)}
.foot a{font-weight:600}
.nav{display:flex;gap:14px;margin-top:18px}
.nav a{flex:1;border:1px solid #e5e1db;border-radius:10px;padding:12px 16px;font-size:14px;color:var(--ink);border-bottom:1px solid #e5e1db}
.nav a small{display:block;color:var(--soft);font-size:12px;margin-bottom:2px}
.nav a:hover{border-color:var(--accent)}
</style>
